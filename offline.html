<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<title>Cashbook Pro — Offline</title>
<link rel="icon" href="favicon.ico">
<script src="offline.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0f1117;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.icon{width:80px;height:80px;margin:0 auto 24px;background:#1e2333;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid #252a38}
h1{font-size:22px;font-weight:500;margin-bottom:10px}
p{color:#64748b;font-size:14px;line-height:1.7;margin-bottom:24px;max-width:320px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#3b82f6;color:#fff;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;border:none;cursor:pointer;font-family:inherit;margin:6px}
.btn-ghost{background:transparent;border:1px solid #252a38;color:#94a3b8}
.pending-box{margin-top:28px;background:#1e2333;border:1px solid #252a38;border-radius:14px;padding:18px 22px;min-width:280px;max-width:360px;text-align:left}
.pending-box h3{font-size:13px;font-weight:500;margin-bottom:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
#pendingList{display:flex;flex-direction:column;gap:8px}
.pitem{font-size:13px;padding:8px 12px;background:#0f1117;border-radius:8px;color:#cbd5e1;display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0}
#statusMsg{margin-top:16px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="icon">📵</div>
<h1>You're offline</h1>
<p>No internet connection. Any transactions you've added are safely saved on this device and will sync automatically when you reconnect.</p>

<div>
  <button class="btn" onclick="tryReconnect()">🔄 Try again</button>
  <a href="javascript:history.back()" class="btn btn-ghost">← Go back</a>
</div>

<div class="pending-box">
  <h3>Pending to sync</h3>
  <div id="pendingList"><div style="color:#475569;font-size:13px">Loading…</div></div>
</div>

<div id="statusMsg"></div>

<script>
async function loadPending() {
  await OfflineDB.open();
  const all = await OfflineDB.getAll(OfflineDB.STORES.queue);
  const pending = all.filter(i => !i.synced);
  const list = document.getElementById('pendingList');
  if (!pending.length) {
    list.innerHTML = '<div style="color:#475569;font-size:13px">✅ Nothing pending</div>';
    return;
  }
  list.innerHTML = pending.map(i => `
    <div class="pitem">
      <div class="status-dot"></div>
      <span>${formatAction(i.action)} — ${timeAgo(i.queued_at)}</span>
    </div>
  `).join('');
}

function formatAction(a) {
  const map = {
    'transaction_add':'Add transaction','transaction_edit':'Edit transaction',
    'transaction_delete':'Delete transaction','book_add':'Create book',
    'book_edit':'Edit book','book_delete':'Delete book',
  };
  return map[a] || a;
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  return new Date(iso).toLocaleDateString();
}

async function tryReconnect() {
  document.getElementById('statusMsg').textContent = 'Checking connection…';
  if (navigator.onLine) {
    document.getElementById('statusMsg').textContent = '✅ Online! Syncing and redirecting…';
    const result = await syncToServer();
    setTimeout(() => window.location.href = 'dashboard.php', 1200);
  } else {
    document.getElementById('statusMsg').textContent = '❌ Still offline. Please check your connection.';
  }
}

window.addEventListener('online', () => {
  document.getElementById('statusMsg').textContent = '✅ Back online! Syncing…';
  syncToServer().then(() => {
    setTimeout(() => window.location.href = 'dashboard.php', 1500);
  });
});

document.addEventListener('DOMContentLoaded', loadPending);
</script>
</body>
</html>
